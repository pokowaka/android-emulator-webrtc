name: Release Prebuilt Web UI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
      - 'ui-v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or Release to attach assets to (e.g. ui-v2.0.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Determine Release Tag
        id: release_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "Using release tag: ${TAG}"

      - name: Setup protoc compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package static Web UI archive
        run: |
          chmod +x scripts/package_ui_release.sh
          ./scripts/package_ui_release.sh

      - name: Upload build artifact (Workflow summary)
        uses: actions/upload-artifact@v4
        with:
          name: emulator-webrtc-ui-build
          path: |
            output/emulator-webrtc-ui.tar.gz
            output/SHA256SUMS
          retention-days: 14

      - name: Upload assets to GitHub Release
        run: |
          TAG="${{ steps.release_tag.outputs.tag_name }}"
          echo "Publishing assets to GitHub Release for tag: ${TAG}"
          
          gh release create "${TAG}" \
            output/emulator-webrtc-ui.tar.gz \
            output/SHA256SUMS \
            --title "Web UI ${TAG}" \
            --notes "Prebuilt static Web UI asset archive for Bazel http_archive consumption." || \
          gh release upload "${TAG}" \
            output/emulator-webrtc-ui.tar.gz \
            output/SHA256SUMS \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
