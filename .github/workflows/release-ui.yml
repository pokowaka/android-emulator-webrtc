name: Release Prebuilt Web UI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
      - 'ui-v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup protoc compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package static Web UI archive
        run: |
          chmod +x scripts/package_ui_release.sh
          ./scripts/package_ui_release.sh

      - name: Upload build artifact (Workflow summary)
        uses: actions/upload-artifact@v4
        with:
          name: emulator-webrtc-ui-build
          path: |
            output/emulator-webrtc-ui.tar.gz
            output/SHA256SUMS
          retention-days: 14

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            output/emulator-webrtc-ui.tar.gz
            output/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
